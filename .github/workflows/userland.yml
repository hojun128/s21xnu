name: userland
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Mesa headers (panfrost genxml packers)
        run: |
          git clone -q --depth 1 -b mesa-24.1.7 https://gitlab.freedesktop.org/mesa/mesa.git mesa
          mkdir -p gx/genxml
          for p in common v9; do python3 mesa/src/panfrost/lib/genxml/gen_pack.py mesa/src/panfrost/lib/genxml/$p.xml > gx/genxml/${p}_pack.h; done
          ls -la gx/genxml
      - name: Build iOS arm64 tools
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          M=$PWD/mesa; G=$PWD/gx
          mkdir -p out
          for f in userland/*.c; do
            n=$(basename "$f" .c)
            xcrun clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.0 -O2 -framework IOKit \
              -I$G -I$M/src/panfrost/lib -I$M/src/panfrost -I$M/include -I$M/src -I$M/src/panfrost/include -I$M/src/compiler \
              "$f" -o "out/$n"
            codesign -f -s - "out/$n"
          done
          for f in userland/*.m; do
            n=$(basename "$f" .m)
            xcrun clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.0 -O2 -fobjc-arc \
              -framework Foundation -framework Metal -framework IOKit "$f" -o "out/$n"
            codesign -f -s - "out/$n"
          done
          mkdir -p out/SweetMetal.bundle
          xcrun clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.0 -O2 -fobjc-arc -bundle \
            -framework Foundation -framework IOKit -framework Metal -Wl,-U,'_OBJC_CLASS_$__MTLDevice' -Wl,-U,'_OBJC_METACLASS_$__MTLDevice' metal/SweetMetal.m -o out/SweetMetal.bundle/SweetMetal
          cp metal/Info.plist out/SweetMetal.bundle/Info.plist
          codesign -f -s - out/SweetMetal.bundle/SweetMetal
          ls -la out out/SweetMetal.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: ios-tools
          path: out/
